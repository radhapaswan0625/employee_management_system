{% extends "base.html" %}

{% block title %}
Add Employee
{% endblock %}

{% block content %}

<div class="container mt-5">

    <h2>Add Employee</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Save Employee
        </button>

        <a href="{% url 'employee_list' %}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
